<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="accent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="980" height="500" rx="16" fill="url(#bg)" stroke="#1f2937" stroke-width="2"/>
  <text x="32" y="42" fill="#f9fafb" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700">macOS 27 ("Golden Gate" ARM64) on x86_64 — Full-System Emulation &amp; FastJIT Stack</text>
  <text x="32" y="64" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="12">Independent Systems & Interoperability Research · Author: Amritpal Singh (@boparaiamrit) · QEMU vmapple/apple-vm AArch64-on-x86_64 Study</text>

  <!-- Guest Box -->
  <rect x="32" y="88" width="916" height="96" rx="10" fill="#172036" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="50" y="112" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="13" font-weight="700">APPLE SILICON GUEST — macOS 27.0 / 27.1 Beta (Builds 26A428, 26A434, 26A5277g · Darwin 27.0.0 ARM64)</text>
  <rect x="50" y="124" width="195" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="147" y="144" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">AVPBooter.patched.bin</text>
  <text x="147" y="160" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">0x2370 Manifest Validator</text>

  <rect x="260" y="124" width="210" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="365" y="144" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">XNU Handoff @ 0xE0A00000</text>
  <text x="365" y="160" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">BootArgs_r3 v2 + NoSEP + wdt=-1</text>

  <rect x="485" y="124" width="210" height="44" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="590" y="144" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, monospace" font-size="11" font-weight="600">Sealed APFS System + Data</text>
  <text x="590" y="160" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">disk3s1 Root Hash OK · disk3s5</text>

  <rect x="710" y="124" width="220" height="44" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="820" y="144" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">WindowServer + SkyLight</text>
  <text x="820" y="160" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="10">1920×1080 RGBA16F / RGB10A2</text>

  <!-- Middle Row: QEMU + FastJIT, Reims vGPU, Streamed NBD -->
  <rect x="32" y="206" width="302" height="196" rx="10" fill="#131c2e" stroke="url(#accent1)" stroke-width="1.8"/>
  <text x="48" y="232" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. QEMU apple-vm + FastJIT Engine</text>
  <text x="48" y="254" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• AArch64 → x86_64 Direct Basic-Block JIT</text>
  <text x="48" y="274" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• 32 MiB RWX Codegen + 8-Step Superblocks</text>
  <text x="48" y="294" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• MTTCG smp=10 · 456,294 Blocks Compiled</text>
  <text x="48" y="314" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">• 1.75B+ Native x86_64 Insns Retired/Boot</text>
  <text x="48" y="340" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">Hardware Fixes: 16 KiB Scratch RAM,</text>
  <text x="48" y="358" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">0x30240040 AVP RTC, 64 KiB CTRR Probe,</text>
  <text x="48" y="376" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">VMApple AES (CONFIG_NETTLE 12/12 NIST)</text>

  <rect x="348" y="206" width="312" height="196" rx="10" fill="#131c2e" stroke="url(#accent2)" stroke-width="1.8"/>
  <text x="364" y="232" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Reims vGPU &amp; Metal-to-Vulkan</text>
  <text x="364" y="254" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• metal2vulkan (.air → llvm-dis → SPIR-V)</text>
  <text x="364" y="274" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• Vector Prefix-Load Fix (0 Shader Fails)</text>
  <text x="364" y="294" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• RGBA16F + RGB10A2 + RGBA16Unorm Rails</text>
  <text x="364" y="314" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">• Memoryless Clear + Ordered MRT Blending</text>
  <text x="364" y="340" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">Lavapipe LP128: VK_EXT_rasterization_order</text>
  <text x="364" y="358" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">Dozen RTX 5070: R12 Framebuffer-Fetch Path</text>
  <text x="364" y="376" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">&lt;150ms Event-Triggered QMP Screendump</text>

  <rect x="674" y="206" width="274" height="196" rx="10" fill="#131c2e" stroke="url(#accent3)" stroke-width="1.8"/>
  <text x="690" y="232" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. Zero-Loss Streamed NBD Disk</text>
  <text x="690" y="254" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• 67 OCI LZFSE Layers → 50 GB ASIF</text>
  <text x="690" y="274" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• 16-Thread nbdkit + RAM Block Cache</text>
  <text x="690" y="294" fill="#e5e7eb" font-family="ui-monospace, monospace" font-size="11">• 8× Adjacent 1 MiB vchunk Prefetch</text>
  <text x="690" y="314" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">• 41,755 Blocks (2.61 GiB) · zero_fills=0</text>
  <text x="690" y="340" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">APFS Headerless Sealed B-Tree Parser,</text>
  <text x="690" y="358" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">SQLite Warm Persistence (extra_cache),</text>
  <text x="690" y="376" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="10.5">Ephemeral qcow2 Writeback Top Overlay</text>

  <!-- Host Bar -->
  <rect x="32" y="422" width="916" height="54" rx="10" fill="#0f172a" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="446" text-anchor="middle" fill="#f3f4f6" font-family="system-ui, sans-serif" font-size="13" font-weight="700">x86_64 Host (Windows 11 + WSL2 + Docker Container Runtime · 18 vCPUs / 14 GiB RAM Cap / 10 GiB Host Disk Guard)</text>
  <text x="490" y="464" text-anchor="middle" fill="#9ca3af" font-family="ui-monospace, monospace" font-size="11">LLVM 19.1.7 (llvm-dis) · SPIRV-Tools v2025.1 (spirv-val) · Mesa 25.0.7 / 26.2.5 (Lavapipe + D3D12 Dozen /dev/dxg)</text>
</svg>
